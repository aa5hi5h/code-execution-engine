services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codebox
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  sandbox:            # only builds the image users' terminals run in
    build: ./sandbox
    image: codebox-sandbox
    command: ["true"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/codebox
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SANDBOX_IMAGE: codebox-sandbox
      SANDBOX_MEMORY: ${SANDBOX_MEMORY:-512m}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-30}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-bridge}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-20}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db: { condition: service_healthy }
      sandbox: { condition: service_completed_successfully }

volumes:
  pgdata:
